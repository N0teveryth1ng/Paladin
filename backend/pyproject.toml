[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paladin-backend"
version = "0.1.0"
description = "AI-native system design whiteboard - architecture graph model"
requires-python = ">=3.11"
dependencies = [
    "networkx==3.6.1",
    "pydantic==2.14.3",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "jsonschema==4.26.0",
    "httpx==0.28.1",
    "pip-audit==2.10.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "app.api", "app.eval", "app.llm", "app.model", "app.validation"]
